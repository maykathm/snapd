project: snapd-antithesis

backends:
    adhoc:
        type: adhoc
        # Must match the password of the systems below.
        allocate: |
            address=$(./incus-allocate.sh) || exit $?
            ADDRESS "$address"
        discard: |
            ./incus-discard.sh "$SPREAD_SYSTEM_ADDRESS"
        systems:
            - ubuntu-26.04-64:
                username: 'test'
                password: 'test'

environment:
    PROJECT_PATH: /home/gopath/src/github.com/snapcore/snapd-antithesis
    TESTSLIB: /opt/snapd-test-support/lib
    TESTSTOOLS: $TESTSLIB/tools
    TESTSTMP: /var/tmp/snapd-tools
    RUNTIME_STATE_PATH: $TESTSTMP/runtime-state
    PATH: /opt/snapd-test-support/bin:/snap/bin:$PATH:/var/lib/snapd/snap/bin
    TRUST_TEST_KEYS: 'true'
    SNAPPY_TESTING: '1'
    SNAPPY_USE_STAGING_STORE: '0'
    REMOTE_STORE: production
    TESTING_TARBALL_PATH: '$(HOST: echo "$TESTING_TARBALL_PATH")'
    FAKE_STORE_TARBALL_PATH: '$(HOST: echo "$FAKE_STORE_TARBALL_PATH")'
    SPREAD_PASSWORD: 'test'

path: /home/gopath/src/github.com/snapcore/snapd-antithesis

repack: |
    tmpdir=$(mktemp -d)
    trap 'rm -rf "$tmpdir"' EXIT
    tar -x --no-same-owner -C "$tmpdir" <&3
    tar -c --owner=12345 --group=12345 --numeric-owner -C "$tmpdir" . >&4

prepare: |
    mkdir -p "$RUNTIME_STATE_PATH"
    touch "$RUNTIME_STATE_PATH/journalctl_cursor"
    type MATCH | tail -n +2 > "$TESTSLIB/spread-funcs.sh"
    type NOMATCH | tail -n +2 >> "$TESTSLIB/spread-funcs.sh"
    type REBOOT | tail -n +2 >> "$TESTSLIB/spread-funcs.sh"

    if [ -n "$ANTITHESIS_OUTPUT_DIR" ]; then
        printf '%s\n' '{"antithesis_setup":{"status":"complete","details":{"message":"snapd test environment ready"}}}' >>"$ANTITHESIS_OUTPUT_DIR/sdk.jsonl"
    fi
    # Give antithesis some time before starting the tests
    sleep 3

restore: rm -r /home/gopath

suites:
    tests/main/:
        summary: Tests for snapd under Antithesis
        prepare-each: |
            "$TESTSTOOLS/journal-state" start-new-log
        restore-each: |
            tests.cleanup restore
            "$TESTSTOOLS/snaps.cleanup" --skip core --skip core24
